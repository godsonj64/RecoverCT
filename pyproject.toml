[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ct-restore"
version = "0.1.0"
description = "Research-grade 3D CT artifact inpainting and denoising for head-and-neck radiotherapy"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "Apache-2.0"}
authors = [{name = "CT Restore contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "scikit-image>=0.22,<1",
  "torch>=2.3,<3",
  "nibabel>=5.2,<6",
  "pydicom>=2.4,<4",
  "SimpleITK>=2.3,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "tqdm>=4.66,<5",
  "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/godsonj64/RecoverCT"
Repository = "https://github.com/godsonj64/RecoverCT"
Issues = "https://github.com/godsonj64/RecoverCT/issues"

[project.optional-dependencies]
train = ["tensorboard>=2.16,<3"]
notebook = ["ipykernel>=6,<8", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
ct-restore = "ct_restore.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ct_restore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
