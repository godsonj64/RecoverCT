data:
  manifest: data/manifests/head_neck_train.csv
  patch_size: [64, 128, 128]
  target_spacing: [1.5, 1.0, 1.0]
  artifact_probability: 0.95
  num_workers: 8
model:
  in_channels: 3
  base_channels: 24
  levels: 4
  blocks_per_level: 2
train:
  stage: head_neck_finetune
  epochs: 200
  batch_size: 1
  learning_rate: 0.00005
  weight_decay: 0.0001
  grad_accumulation: 4
  amp: true
  ema_decay: 0.9995
  pretrained: checkpoints/pretrain/best.pt
  checkpoint_dir: checkpoints/finetune
loss:
  artifact_l1: 8.0
  global_l1: 1.0
  gradient: 1.0
  ssim: 0.5
  identity: 3.0
  uncertainty: 0.2
hardware:
  device: auto
  precision: auto
  auto_tune: false
  allow_tf32: true
  cudnn_benchmark: true
  channels_last_3d: true
  compile: false
  prefetch_factor: 2
